<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>후쿠오카 여행 날씨 · 9/13-9/16</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="후쿠오카날씨">
<style>
  :root{
    --bg: #eef4fb;
    --bg2: #dce8f7;
    --card: #ffffff;
    --card-border: #e2e8f0;
    --text: #1e293b;
    --text-dim: #64748b;
    --accent: #2563eb;
    --accent-soft: #dbeafe;
    --shadow: 0 4px 16px rgba(30, 64, 175, 0.08);
    --shadow-lg: 0 12px 32px rgba(30, 64, 175, 0.12);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg: #0b1220;
      --bg2: #0f1830;
      --card: #141d33;
      --card-border: #22304d;
      --text: #e6ecf7;
      --text-dim: #93a1bd;
      --accent: #60a5fa;
      --accent-soft: #1e3a6a;
      --shadow: 0 4px 16px rgba(0,0,0,0.35);
      --shadow-lg: 0 12px 32px rgba(0,0,0,0.45);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", Pretendard, Roboto, sans-serif;
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
    color: var(--text);
    min-height:100vh;
    padding: 24px clamp(12px, 1.5vw, 28px) 60px;
  }
  .wrap{max-width: 1900px; margin: 0 auto;}
  header.top{
    display:flex; align-items:flex-start; justify-content:space-between; gap:16px;
    margin-bottom: 20px; flex-wrap: wrap;
  }
  h1{font-size: 22px; margin: 0 0 4px; letter-spacing:-0.02em;}
  .subtitle{color: var(--text-dim); font-size: 13px; margin:0;}
  .refresh-box{display:flex; flex-direction:column; align-items:flex-end; gap:4px;}
  #refreshBtn{
    border:none; background: var(--accent); color:#fff; font-size:13px; font-weight:600;
    padding:8px 14px; border-radius:999px; cursor:pointer; display:flex; align-items:center; gap:6px;
    box-shadow: var(--shadow);
    transition: transform .15s ease, opacity .15s ease;
  }
  #refreshBtn:hover{opacity:.9;}
  #refreshBtn:active{transform: scale(0.96);}
  #refreshBtn.loading .spin{animation: spin 0.9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .updated{font-size:11px; color: var(--text-dim);}

  .tabs{display:flex; gap:8px; margin-bottom:18px; overflow-x:auto; padding-bottom:2px;}
  .tab{
    flex: 0 0 auto; padding:10px 16px; border-radius: 14px; background: var(--card);
    border:1px solid var(--card-border); cursor:pointer; text-align:center; min-width:84px;
    box-shadow: var(--shadow);
  }
  .tab .d{font-size:11px; color:var(--text-dim);}
  .tab .n{font-size:15px; font-weight:700;}
  .tab.active{background: var(--accent); border-color: var(--accent);}
  .tab.active .d, .tab.active .n{color:#fff;}

  .panel{display:none;}
  .panel.active{display:block; animation: fade .25s ease;}
  @keyframes fade{from{opacity:0; transform: translateY(4px);} to{opacity:1; transform:none;}}

  .summary{
    display:flex; gap:14px; flex-wrap:wrap; margin-bottom:16px;
  }
  .stat{
    background: var(--card); border:1px solid var(--card-border); border-radius:16px;
    padding:14px 18px; flex:1; min-width:120px; box-shadow: var(--shadow);
  }
  .stat .label{font-size:11px; color:var(--text-dim); margin-bottom:4px;}
  .stat .value{font-size:20px; font-weight:700;}
  .stat .value.hi{color:#ef4444;}
  .stat .value.lo{color:#3b82f6;}
  .stat .value.rain{color:#0ea5e9;}

  .stripWrap{margin-bottom:10px;}
  .strip{
    display:flex; border-radius:12px; overflow:hidden; box-shadow: var(--shadow);
    font-size:12px; font-weight:600; color:#fff;
  }
  .strip .seg{padding:8px 4px; text-align:center; white-space:nowrap; overflow:hidden;}
  .boundaryList{display:flex; flex-direction:column; gap:6px; margin:10px 0 4px;}
  .boundaryRow{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:var(--card); border:1px solid var(--card-border); border-radius:10px;
    padding:6px 8px 6px 12px; font-size:12px;
  }
  .boundaryLabel{color:var(--text); min-width:0; overflow:hidden; text-overflow:ellipsis;}
  .boundaryStepper{display:flex; align-items:center; gap:6px; flex:0 0 auto;}
  .boundaryStepper button{
    width:30px; height:30px; border-radius:8px; border:1px solid var(--card-border); background:var(--bg);
    color:var(--text); font-size:17px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .boundaryStepper button:active{background:var(--accent-soft);}
  .boundaryStepper button:disabled{opacity:.35; cursor:default;}
  .boundaryHour{font-weight:700; font-size:12.5px; min-width:46px; text-align:center;}
  .resetBtn{
    display:block; margin:0 auto 12px; font-size:11.5px; color:var(--accent); background:none;
    border:none; cursor:pointer; padding:2px 4px; text-decoration:underline;
  }

  .hours{
    display:flex; gap:10px; overflow-x:auto; padding: 4px 2px 12px;
  }
  .hcard{
    flex: 1 1 78px; min-width:78px; max-width:150px; background: var(--card); border:1px solid var(--card-border);
    border-radius:16px; padding:14px 8px; text-align:center; box-shadow: var(--shadow);
    position:relative;
  }
  .hcard .hour{font-size:12px; color:var(--text-dim); font-weight:600;}
  .hcard .badge{
    display:inline-block; font-size:9px; font-weight:700; color:#fff; padding:2px 6px;
    border-radius:999px; margin-top:4px;
  }
  .hcard .icon{font-size:28px; margin:8px 0 4px;}
  .hcard .temp{font-size:17px; font-weight:700;}
  .hcard .precip{font-size:11px; margin-top:6px; padding:3px 6px; border-radius:8px; font-weight:600;}
  .hcard .precip.none{color: var(--text-dim); background: transparent;}

  .legend{font-size:11px; color:var(--text-dim); display:flex; gap:14px; flex-wrap:wrap; margin-top:6px;}
  .legend .lg-item{display:flex; align-items:center; gap:5px;}
  .legend .dot{width:9px; height:9px; border-radius:50%; display:inline-block;}

  .banner{
    background: var(--accent-soft); border-radius:14px; padding:14px 16px; margin-bottom:16px;
    font-size:13px; display:none;
  }
  .banner.show{display:block;}
  .banner.err{background:#fee2e2; color:#991b1b;}

  footer{text-align:center; font-size:11px; color:var(--text-dim); margin-top:30px;}

  .modeSwitch{display:flex; gap:8px; margin-bottom:16px;}
  .modeBtn{
    flex:1; padding:10px; border-radius:12px; border:1px solid var(--card-border); background:var(--card);
    font-weight:700; font-size:13px; cursor:pointer; color:var(--text-dim);
  }
  .modeBtn.active{background:var(--accent); color:#fff; border-color:var(--accent);}

  .iti-item{display:flex; align-items:stretch; gap:8px;}
  .iti-time{flex:0 0 42px; width:42px; text-align:right; padding-top:6px; overflow:hidden;}
  .iti-time .t{font-size:12.5px; font-weight:700; white-space:nowrap;}
  .iti-time .dur{font-size:9.5px; color:var(--text-dim); margin-top:2px; white-space:nowrap;}
  .iti-line{flex:0 0 26px; width:26px; display:flex; flex-direction:column; align-items:center;}
  .iti-dot{
    flex:0 0 auto; width:26px; height:26px; border-radius:50%;
    background:var(--card); border:2px solid var(--accent); display:flex; align-items:center;
    justify-content:center; font-size:13px;
  }
  .iti-line::after{content:''; flex:1; width:2px; background:var(--card-border); margin:4px 0;}
  .iti-item:last-child .iti-line::after{display:none;}
  .iti-card{
    flex:1 1 auto; min-width:0; background:var(--card); border:1px solid var(--card-border); border-radius:14px;
    padding:10px 14px; box-shadow:var(--shadow); margin-bottom:14px;
  }
  .iti-title-row{display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
  .iti-title{font-weight:700; font-size:14px; min-width:0; overflow-wrap:break-word;}
  .iti-price{font-size:12px; font-weight:700; color:#059669; white-space:nowrap;}
  .iti-detail{font-size:12.5px; color:var(--text); margin-top:4px; overflow-wrap:break-word;}
  .iti-note{font-size:11.5px; color:var(--text-dim); margin-top:4px; font-style:italic; overflow-wrap:break-word;}
  .iti-period{font-size:12px; font-weight:700; color:var(--accent); margin:0 0 8px 50px;}
  .iti-period:not(:first-child){margin-top:8px;}

  .packGrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); gap:12px;}
  .packCard{
    background:var(--card); border:1px solid var(--card-border); border-radius:14px;
    overflow:hidden; box-shadow:var(--shadow); position:relative;
  }
  .packCard img{width:100%; aspect-ratio:1/1; object-fit:cover; display:block; background:#e2e8f0; cursor:pointer;}
  .packCard .memo{padding:8px 10px; font-size:12.5px; word-break:break-word;}
  .packCard .delBtn{
    position:absolute; top:6px; right:6px; width:24px; height:24px; border-radius:50%;
    background:rgba(0,0,0,0.55); color:#fff; border:none; font-size:14px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .packEmpty{text-align:center; color:var(--text-dim); font-size:13px; padding:40px 0;}
  .fab{
    position:fixed; right:20px; bottom:24px; width:56px; height:56px; border-radius:50%;
    background:var(--accent); color:#fff; border:none; font-size:28px; box-shadow:var(--shadow-lg);
    cursor:pointer; z-index:20; display:flex; align-items:center; justify-content:center;
  }
  .modalOverlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center;
    justify-content:center; z-index:30; padding:20px;
  }
  .modalBox{background:var(--card); border-radius:16px; padding:20px; max-width:360px; width:100%; box-shadow:var(--shadow-lg);}
  .modalBox h3{margin:0 0 14px; font-size:16px;}
  .modalBox input[type=file]{width:100%; margin-bottom:12px; font-size:13px; color:var(--text);}
  .modalBox input[type=text]{
    width:100%; padding:10px; border-radius:10px; border:1px solid var(--card-border);
    font-size:13px; margin-bottom:14px; background:var(--bg); color:var(--text);
  }
  .modalBox .previewImg{width:100%; max-height:160px; object-fit:contain; border-radius:10px; margin-bottom:12px; display:none; background:#f1f5f9;}
  .modalActions{display:flex; gap:8px;}
  .modalActions button{flex:1; padding:10px; border-radius:10px; border:none; font-weight:700; font-size:13px; cursor:pointer;}
  .btnCancel{background:var(--bg2); color:var(--text);}
  .btnSave{background:var(--accent); color:#fff;}
  .btnSave:disabled{opacity:.5;}

  .viewerOverlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.85); display:flex; align-items:center;
    justify-content:center; z-index:40; padding:20px;
  }
  .viewerBox{display:flex; flex-direction:column; align-items:center; max-width:100%; max-height:100%;}
  .viewerBox img{max-width:100%; max-height:78vh; border-radius:12px; object-fit:contain;}
  .viewerMemo{color:#fff; text-align:center; margin-top:14px; font-size:14px; padding:0 10px;}
  .viewerClose{
    position:fixed; top:16px; right:16px; width:38px; height:38px; border-radius:50%;
    background:rgba(255,255,255,0.15); color:#fff; border:none; font-size:20px; cursor:pointer;
  }
  .viewerNav{
    position:fixed; top:50%; transform:translateY(-50%); width:44px; height:44px; border-radius:50%;
    background:rgba(255,255,255,0.15); color:#fff; border:none; font-size:24px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; z-index:41;
  }
  .viewerNav:disabled{opacity:.3; cursor:default;}
  .viewerPrev{left:10px;}
  .viewerNext{right:10px;}
  .viewerCounter{
    position:fixed; top:18px; left:50%; transform:translateX(-50%); color:#fff;
    font-size:12.5px; z-index:41; background:rgba(255,255,255,0.12); padding:4px 12px; border-radius:999px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 id="pageTitle">🌤️ 후쿠오카 여행 날씨</h1>
      <p class="subtitle" id="pageSubtitle">2026.09.13 (일) ~ 09.16 (수) · 오전 7시 ~ 자정, 시간별 기온·강수량</p>
    </div>
    <div class="refresh-box" id="refreshBox">
      <button id="refreshBtn" onclick="loadAll()">
        <span class="spin">⟳</span> 갱신
      </button>
      <span class="updated" id="updatedAt">불러오는 중...</span>
    </div>
  </header>

  <div class="modeSwitch">
    <button class="modeBtn active" data-mode="weather" onclick="switchMode('weather')">🌤️ 날씨</button>
    <button class="modeBtn" data-mode="itinerary" onclick="switchMode('itinerary')">🗓️ 일정</button>
    <button class="modeBtn" data-mode="pack" onclick="switchMode('pack')">🎒 준비물</button>
  </div>

  <div id="errBanner" class="banner err"></div>

  <div class="tabs" id="tabs"></div>

  <div id="weatherSection">
    <div id="panels"></div>
    <div class="legend">
      <span class="lg-item"><span class="dot" style="background:#3b82f6"></span> 후쿠오카시</span>
      <span class="lg-item"><span class="dot" style="background:#10b981"></span> 구마모토시</span>
      <span class="lg-item"><span class="dot" style="background:#8b5cf6"></span> 나카쓰시</span>
      <span class="lg-item"><span class="dot" style="background:#f59e0b"></span> 키타큐슈시</span>
      <span class="lg-item"><span class="dot" style="background:#ec4899"></span> 다자이후시</span>
      <span class="lg-item"><span class="dot" style="background:#14b8a6"></span> 창원시</span>
    </div>
  </div>

  <div id="itinerarySection" style="display:none">
    <div id="itiPanels"></div>
  </div>

  <div id="packSection" style="display:none">
    <div id="packGrid" class="packGrid"></div>
    <div id="packEmpty" class="packEmpty" style="display:none">아직 등록된 준비물이 없어요. 오른쪽 아래 + 버튼으로 추가해보세요.</div>
  </div>

  <footer id="pageFooter">데이터 출처: Open-Meteo.com (무료 기상 예보 API) · 예보는 갱신 시점 기준 최신값입니다.</footer>
</div>

<button id="fabAdd" class="fab" style="display:none" onclick="openPackModal()">+</button>

<div id="packModalOverlay" class="modalOverlay" style="display:none">
  <div class="modalBox">
    <h3>준비물 등록</h3>
    <input type="file" id="packFile" accept="image/*" onchange="onPackFileChange(event)">
    <img id="packPreview" class="previewImg">
    <input type="text" id="packMemo" placeholder="한줄 메모 (예: 호텔 바우처, 유심 QR)" maxlength="60">
    <div class="modalActions">
      <button class="btnCancel" onclick="closePackModal()">취소</button>
      <button class="btnSave" id="packSaveBtn" onclick="savePackItem()">등록</button>
    </div>
  </div>
</div>

<div id="packViewerOverlay" class="viewerOverlay" style="display:none" onclick="closePackViewer()"
     ontouchstart="onViewerTouchStart(event)" ontouchend="onViewerTouchEnd(event)">
  <button class="viewerClose" onclick="event.stopPropagation(); closePackViewer()">×</button>
  <div id="packViewerCounter" class="viewerCounter"></div>
  <button id="packViewerPrevBtn" class="viewerNav viewerPrev" onclick="event.stopPropagation(); packViewerPrev()">‹</button>
  <button id="packViewerNextBtn" class="viewerNav viewerNext" onclick="event.stopPropagation(); packViewerNext()">›</button>
  <div class="viewerBox" onclick="event.stopPropagation()">
    <img id="packViewerImg" src="" alt="">
    <div id="packViewerMemo" class="viewerMemo"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
const LOCATIONS = {
  fukuoka:   {name:'후쿠오카시', lat:33.5904, lon:130.4017, color:'#3b82f6'},
  kumamoto:  {name:'구마모토시', lat:32.7898, lon:130.7417, color:'#10b981'},
  nakatsu:   {name:'나카쓰시',   lat:33.5985, lon:131.1873, color:'#8b5cf6'},
  kitakyushu:{name:'키타큐슈시', lat:33.8834, lon:130.8751, color:'#f59e0b'},
  dazaifu:   {name:'다자이후시', lat:33.5147, lon:130.5352, color:'#ec4899'},
  changwon:  {name:'창원시',     lat:35.2281, lon:128.6811, color:'#14b8a6'},
};

// hour -> location key, per date. Boundary hour belongs to the NEW location.
const SCHEDULE = {
  '2026-09-13': mkHours([[7,9,'fukuoka'],[9,16,'kumamoto'],[16,25,'fukuoka']]),
  '2026-09-14': mkHours([[7,9,'fukuoka'],[9,13,'nakatsu'],[13,20,'kitakyushu'],[20,25,'fukuoka']]),
  '2026-09-15': mkHours([[7,10,'fukuoka'],[10,14,'dazaifu'],[14,25,'fukuoka']]),
  '2026-09-16': mkHours([[7,13,'fukuoka'],[13,25,'changwon']]),
};

function mkHours(segments){
  // segments: [from, to_exclusive, loc] ; last hour of day is 24 (=midnight), inclusive
  const map = {};
  for(const [from,to,loc] of segments){
    for(let h=from; h<to; h++) map[h]=loc;
  }
  return map;
}

const DATES = Object.keys(SCHEDULE);
const START_DATE = '2026-09-13';
const END_DATE = '2026-09-17'; // one extra day so hour 24 (midnight) of the 16th resolves

const WMO = {
  0:['☀️','맑음'],1:['🌤️','대체로 맑음'],2:['⛅','구름 조금'],3:['☁️','흐림'],
  45:['🌫️','안개'],48:['🌫️','안개'],
  51:['🌦️','약한 이슬비'],53:['🌦️','이슬비'],55:['🌧️','강한 이슬비'],
  56:['🌧️','언 이슬비'],57:['🌧️','언 이슬비'],
  61:['🌦️','약한 비'],63:['🌧️','비'],65:['🌧️','강한 비'],
  66:['🌧️','언 비'],67:['🌧️','언 비'],
  71:['🌨️','약한 눈'],73:['🌨️','눈'],75:['❄️','강한 눈'],77:['🌨️','싸락눈'],
  80:['🌦️','소나기'],81:['🌧️','소나기'],82:['⛈️','강한 소나기'],
  85:['🌨️','소나기눈'],86:['❄️','강한 소나기눈'],
  95:['⛈️','뇌우'],96:['⛈️','뇌우/우박'],99:['⛈️','강한 뇌우/우박'],
};
function wmo(code){ return WMO[code] || ['🌡️','-']; }

const ITINERARY = {
  '2026-09-13': [
    {period:'오전',t:'4:00',title:'기상'},
    {period:'오전',t:'5:30',title:'주차장'},
    {period:'오전',t:'7:00',title:'후쿠오카행 비행기 이륙',detail:'제주항공 7C1451',note:'우선수하물 구입'},
    {period:'오전',t:'8:00',title:'후쿠오카 공항 착륙',detail:'입국심사 및 교통카드 충전',price:2000},
    {period:'오전',t:'9:00',title:'하카타역, 호텔 짐맡기기',detail:'패스권 수령'},
    {period:'오전',t:'9:28',dur:'42분',title:'하카타 → 구마모토',detail:'큐슈 신칸센(사쿠라 743 사쿠라 구마모토)'},

function itiIcon(e){
  const all = (e.title||'') + ' ' + (e.detail||'');
  if(/비행기|공항|이륙|착륙/.test(all)) return '✈️';
  if(/신칸센|소닉|본선|열차/.test(all)) return '🚄';
  if(/버스터미널|버스/.test(all)) return '🚌';
  if(/셔틀/.test(all)) return '🚐';
  if(/케이블카|슬로프카/.test(all)) return '🚡';
  if(/도보/.test(all)) return '🚶';
  if(/식사|점심|아침|저녁/.test(e.title||'')) return '🍽️';
  if(/쇼핑|구입|구매/.test(e.title||'')) return '🛍️';
  if(/관람|전망대|박물관|성$|텐만구/.test(e.title||'')) return '📸';
  if(/기상/.test(e.title||'')) return '⏰';
  if(/체크인/.test(e.title||'')) return '🔑';
  if(/체크아웃/.test(e.title||'')) return '🧳';
  if(/웨이팅/.test(e.title||'')) return '⏳';
  if(/휴식|자유시간/.test(e.title||'')) return '☕';
  return '📍';
}

let CACHE = {}; // loc -> {temp:Map, precip:Map, code:Map}
let activeDate = DATES[0];
let MODE = 'weather';

function buildUrl(locKey){
  const l = LOCATIONS[locKey];
  return `https://api.open-meteo.com/v1/forecast?latitude=${l.lat}&longitude=${l.lon}`
    + `&hourly=temperature_2m,precipitation,weathercode`
    + `&start_date=${START_DATE}&end_date=${END_DATE}&timezone=Asia%2FTokyo`;
}

function keyFor(dateStr, hour){
  if(hour < 24) return `${dateStr}T${String(hour).padStart(2,'0')}:00`;
  // hour 24 -> next day 00:00
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+1);
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}T00:00`;
}

async function fetchLoc(locKey){
  const res = await fetch(buildUrl(locKey));
  if(!res.ok) throw new Error(`${LOCATIONS[locKey].name} 예보 요청 실패 (${res.status})`);
  const j = await res.json();
  const temp={}, precip={}, code={};
  j.hourly.time.forEach((t,i)=>{
    temp[t]=j.hourly.temperature_2m[i];
    precip[t]=j.hourly.precipitation[i];
    code[t]=j.hourly.weathercode[i];
  });
  return {temp,precip,code};
}

async function loadAll(){
  const btn = document.getElementById('refreshBtn');
  const upd = document.getElementById('updatedAt');
  const err = document.getElementById('errBanner');
  btn.classList.add('loading'); btn.disabled = true;
  err.classList.remove('show'); err.textContent='';
  try{
    const keys = Object.keys(LOCATIONS);
    const results = await Promise.all(keys.map(k=>fetchLoc(k)));
    keys.forEach((k,i)=> CACHE[k]=results[i]);
    if(MODE==='weather') renderWeatherPanels();
    const now = new Date();
    upd.textContent = '마지막 갱신: ' + now.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    try{ localStorage.setItem('fukuokaWeatherCache', JSON.stringify({CACHE, ts: now.toISOString()})); }catch(e){}
  }catch(e){
    err.textContent = '⚠️ 날씨 정보를 가져오지 못했습니다. 인터넷 연결을 확인한 뒤 갱신 버튼을 눌러주세요. (' + e.message + ')';
    err.classList.add('show');
    const cached = loadCache();
    if(cached){
      CACHE = cached.CACHE;
      if(MODE==='weather') renderWeatherPanels();
      upd.textContent = '오프라인 · 마지막 저장: ' + new Date(cached.ts).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
    } else {
      upd.textContent = '갱신 실패';
    }
  }finally{
    btn.classList.remove('loading'); btn.disabled = false;
  }
}

function loadCache(){
  try{
    const raw = localStorage.getItem('fukuokaWeatherCache');
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}

  return {md, wd};
}

const CANONICAL_HOURS = {};
DATES.forEach(d=>{ CANONICAL_HOURS[d] = Object.keys(SCHEDULE[d]).map(Number).sort((a,b)=>a-b); });

function baseGroups(dateStr){
  const schedule = SCHEDULE[dateStr];
  const hours = CANONICAL_HOURS[dateStr];
  const groups = [];
  hours.forEach(h=>{
    const locKey = schedule[h];
    const last = groups[groups.length-1];
    if(last && last.locKey===locKey) last.count++;
    else groups.push({locKey, count:1});
  });
  return groups;
}

function loadScheduleOverride(){
  try{ return JSON.parse(localStorage.getItem('fukuokaScheduleOverride') || '{}'); }
  catch(e){ return {}; }
}
function saveScheduleOverride(){
  try{ localStorage.setItem('fukuokaScheduleOverride', JSON.stringify(SCHEDULE_OVERRIDE)); }catch(e){}
}
let SCHEDULE_OVERRIDE = loadScheduleOverride();

function getGroups(dateStr){
  return SCHEDULE_OVERRIDE[dateStr] || baseGroups(dateStr);
}
function hasOverride(dateStr){ return !!SCHEDULE_OVERRIDE[dateStr]; }
function resetSchedule(dateStr){
  delete SCHEDULE_OVERRIDE[dateStr];
  saveScheduleOverride();
  updateWeatherPanel(dateStr);
}

function groupsToHourMap(dateStr, groups){
  const hours = CANONICAL_HOURS[dateStr];
  const map = {};
  let idx = 0;
  groups.forEach(g=>{
    for(let i=0; i<g.count; i++){ map[hours[idx]] = g.locKey; idx++; }
  });
  return map;
}

function buildWeatherPanelHtml(dateStr){
  const groups = getGroups(dateStr);
  const schedule = groupsToHourMap(dateStr, groups);
  const hours = CANONICAL_HOURS[dateStr];
  const totalHours = hours.length;

  const rows = hours.map(h=>{
    const locKey = schedule[h];
    const loc = LOCATIONS[locKey];
    const tk = keyFor(dateStr, h);
    const data = CACHE[locKey];
    const temp = data ? data.temp[tk] : undefined;
    const precip = data ? data.precip[tk] : undefined;
    const code = data ? data.code[tk] : undefined;
    return {h, locKey, loc, temp, precip, code};
  });

  const haveData = rows.some(r=>r.temp!==undefined);
  let hi=-Infinity, lo=Infinity, rainSum=0;
  rows.forEach(r=>{
    if(typeof r.temp==='number'){ hi=Math.max(hi,r.temp); lo=Math.min(lo,r.temp); }
    if(typeof r.precip==='number') rainSum += r.precip;
  });

  const {md,wd} = dateLabel(dateStr);

  let cum = 0;
  const boundaryRows = groups.slice(0,-1).map((g,i)=>{
    cum += g.count;
    const hourLabel = hours[cum]===24 ? '24시' : hours[cum] + '시';
    const leftLoc = LOCATIONS[groups[i].locKey];
    const rightLoc = LOCATIONS[groups[i+1].locKey];
    const cumBefore = groups.slice(0,i).reduce((s,x)=>s+x.count,0);
    const cumSpan = cumBefore + groups[i].count + groups[i+1].count;
    const atMin = (cum <= cumBefore + 1);
    const atMax = (cum >= cumSpan - 1);
    return `
      <div class="boundaryRow">
        <span class="boundaryLabel"><b style="color:${leftLoc.color}">${leftLoc.name.replace('시','')}</b> → <b style="color:${rightLoc.color}">${rightLoc.name.replace('시','')}</b> 전환</span>
        <div class="boundaryStepper">
          <button onclick="shiftBoundary('${dateStr}',${i},-1)" ${atMin?'disabled':''}>−</button>
          <span class="boundaryHour">${hourLabel}</span>
          <button onclick="shiftBoundary('${dateStr}',${i},1)" ${atMax?'disabled':''}>＋</button>
        </div>
      </div>`;
  }).join('');

  return `
    <div class="summary">
      <div class="stat"><div class="label">${md} (${wd}) 최고</div><div class="value hi">${haveData && isFinite(hi)?Math.round(hi)+'°':'-'}</div></div>
      <div class="stat"><div class="label">최저</div><div class="value lo">${haveData && isFinite(lo)?Math.round(lo)+'°':'-'}</div></div>
      <div class="stat"><div class="label">누적 강수량</div><div class="value rain">${haveData?rainSum.toFixed(1)+'mm':'-'}</div></div>
    </div>
    <div class="stripWrap">
      <div class="strip" id="strip-${dateStr}">
        ${groups.map(g=>`<div class="seg" style="flex:${g.count}; background:${LOCATIONS[g.locKey].color}">${LOCATIONS[g.locKey].name}</div>`).join('')}
      </div>
    </div>
    <div class="boundaryList">${boundaryRows}</div>
    ${hasOverride(dateStr) ? `<button class="resetBtn" onclick="resetSchedule('${dateStr}')">↺ 이 날짜 원래대로 되돌리기</button>` : ''}
    <div class="hours">
      ${rows.map(r=>{
        const [icon] = wmo(r.code);
        const tempTxt = typeof r.temp==='number' ? Math.round(r.temp)+'°' : '-';
        let precipHtml;
        if(typeof r.precip!=='number'){
          precipHtml = `<div class="precip none">-</div>`;
        } else if(r.precip <= 0){
          precipHtml = `<div class="precip none">0mm</div>`;
        } else {
          const intensity = r.precip < 1 ? 'rgba(14,165,233,0.15)' : r.precip < 4 ? 'rgba(14,165,233,0.35)' : 'rgba(14,165,233,0.6)';
          const tColor = r.precip < 4 ? '#0369a1' : '#fff';
          precipHtml = `<div class="precip" style="background:${intensity}; color:${tColor}">💧${r.precip.toFixed(1)}mm</div>`;
        }
        const hourLabel = r.h===24 ? '24시' : `${r.h}시`;
        return `
          <div class="hcard">
            <div class="hour">${hourLabel}</div>
            <div class="badge" style="background:${r.loc.color}">${r.loc.name.replace('시','')}</div>
            <div class="icon">${icon}</div>
            <div class="temp">${tempTxt}</div>
            ${precipHtml}
          </div>`;
      }).join('')}
    </div>
  `;
}

function updateWeatherPanel(dateStr){
  const panel = document.querySelector('#panels .panel[data-date="' + dateStr + '"]');
  if(panel) panel.innerHTML = buildWeatherPanelHtml(dateStr);
}

function shiftBoundary(dateStr, boundaryIdx, delta){
  const groups = getGroups(dateStr).map(g=>({...g}));
  const cumBefore = groups.slice(0, boundaryIdx).reduce((s,g)=>s+g.count,0);
  const cumSpan = cumBefore + groups[boundaryIdx].count + groups[boundaryIdx+1].count;
  let hourPos = cumBefore + groups[boundaryIdx].count + delta;
  hourPos = Math.max(cumBefore + 1, Math.min(cumSpan - 1, hourPos));

  const newLeftCount = hourPos - cumBefore;
  if(newLeftCount === groups[boundaryIdx].count) return;

  groups[boundaryIdx].count = newLeftCount;
  groups[boundaryIdx+1].count = cumSpan - hourPos;
  SCHEDULE_OVERRIDE[dateStr] = groups;
  saveScheduleOverride();
  updateWeatherPanel(dateStr);
}

function initPack(){

function subscribePack(){

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function renderPack(){
  const grid = document.getElementById('packGrid');
  const empty = document.getElementById('packEmpty');
  if(!packReady){
    grid.innerHTML = '';
    empty.style.display = '';
    empty.textContent = '준비물 기능을 사용하려면 Firebase 설정이 필요합니다. (개발자 안내 참고)';
    return;
  }
  if(packItems.length===0){
    grid.innerHTML = '';
    empty.style.display = '';
    empty.textContent = '아직 등록된 준비물이 없어요. 오른쪽 아래 + 버튼으로 추가해보세요.';
    return;
  }
  empty.style.display = 'none';
  grid.innerHTML = packItems.map(it => `
    <div class="packCard">
      <button class="delBtn" onclick="deletePackItem('${it.id}')">×</button>
      <img src="${it.imageData}" alt="" onclick="viewPackItem('${it.id}')">
      <div class="memo">${escapeHtml(it.memo || '')}</div>
    </div>
  `).join('');
}

let packViewerIndex = -1;
let packViewerTouchX = null;

function viewPackItem(id){
  const idx = packItems.findIndex(p=> p.id===id);
  if(idx < 0) return;
  showPackViewer(idx);
}

function showPackViewer(idx){
  if(packItems.length===0) return;
  packViewerIndex = (idx + packItems.length) % packItems.length;
  const it = packItems[packViewerIndex];
  document.getElementById('packViewerImg').src = it.imageData;
  document.getElementById('packViewerMemo').textContent = it.memo || '';
  document.getElementById('packViewerCounter').textContent = `${packViewerIndex+1} / ${packItems.length}`;
  const multi = packItems.length > 1;
  document.getElementById('packViewerPrevBtn').style.display = multi ? 'flex' : 'none';
  document.getElementById('packViewerNextBtn').style.display = multi ? 'flex' : 'none';
  document.getElementById('packViewerOverlay').style.display = 'flex';
}

function packViewerNext(){ showPackViewer(packViewerIndex + 1); }
function packViewerPrev(){ showPackViewer(packViewerIndex - 1); }

function closePackViewer(){
  document.getElementById('packViewerOverlay').style.display = 'none';
  packViewerIndex = -1;
}

function onViewerTouchStart(ev){
  packViewerTouchX = ev.changedTouches[0].clientX;
}
function onViewerTouchEnd(ev){
  if(packViewerTouchX===null) return;
  const dx = ev.changedTouches[0].clientX - packViewerTouchX;
  packViewerTouchX = null;
  if(Math.abs(dx) > 40){
    if(dx < 0) packViewerNext(); else packViewerPrev();
  }
}

document.addEventListener('keydown', (ev)=>{
  if(document.getElementById('packViewerOverlay').style.display !== 'flex') return;
  if(ev.key==='ArrowRight') packViewerNext();
  else if(ev.key==='ArrowLeft') packViewerPrev();
  else if(ev.key==='Escape') closePackViewer();
});

function openPackModal(){
  document.getElementById('packModalOverlay').style.display = 'flex';
}
function closePackModal(){
  document.getElementById('packModalOverlay').style.display = 'none';
  document.getElementById('packFile').value = '';
  document.getElementById('packMemo').value = '';
  document.getElementById('packPreview').style.display = 'none';
  pendingFile = null;
}

function onPackFileChange(ev){
  const file = ev.target.files[0];
  if(!file) return;
  pendingFile = file;
  const reader = new FileReader();
  reader.onload = (e)=>{
    const img = document.getElementById('packPreview');
    img.src = e.target.result;
    img.style.display = 'block';
  };
  reader.readAsDataURL(file);
}

function loadImageEl(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=> resolve(img);
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function drawToDataUrl(img, maxSize, quality){
  let {width, height} = img;
  if(width > height && width > maxSize){ height = height * maxSize / width; width = maxSize; }
  else if(height > maxSize){ width = width * maxSize / height; height = maxSize; }
  const canvas = document.createElement('canvas');
  canvas.width = width; canvas.height = height;
  canvas.getContext('2d').drawImage(img, 0, 0, width, height);
  return canvas.toDataURL('image/jpeg', quality);
}

// Firestore 문서 용량 한도(1MB) 안에 들어가도록, 필요하면 화질/크기를 점점 낮춰가며 압축합니다.
async function compressToDataUrl(file){
  const img = await loadImageEl(file);
  let maxSize = 1000, quality = 0.7;
  let dataUrl = drawToDataUrl(img, maxSize, quality);
  let tries = 0;
  while(dataUrl.length > 900000 && tries < 6){
    if(quality > 0.35) quality -= 0.15; else maxSize = Math.max(500, maxSize - 150);
    dataUrl = drawToDataUrl(img, maxSize, quality);
    tries++;
  }
  return dataUrl;
}

async function savePackItem(){
  const memo = document.getElementById('packMemo').value.trim();
  if(!pendingFile){ alert('사진을 선택해주세요.'); return; }
  if(!packReady){ alert('준비물 기능이 아직 설정되지 않았습니다.'); return; }
  const btn = document.getElementById('packSaveBtn');
  btn.disabled = true; btn.textContent = '등록 중...';
  try{
    const dataUrl = await compressToDataUrl(pendingFile);
    if(dataUrl.length > 950000){
      alert('이미지 용량이 너무 커서 저장할 수 없어요. 더 단순한 이미지로 시도해주세요.');
      return;
    }
    await packDb.collection(PACK_PATH + '/items').add({
      imageData: dataUrl, memo, createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
    closePackModal();
  }catch(e){
    alert('등록 실패: ' + e.message);
  }finally{
    btn.disabled = false; btn.textContent = '등록';
  }
}

async function deletePackItem(id){
  if(!confirm('삭제할까요?')) return;
  try{ await packDb.collection(PACK_PATH + '/items').doc(id).delete(); }
  catch(e){ alert('삭제 실패: ' + e.message); }
}
